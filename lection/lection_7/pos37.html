<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 37</title>
    <script>
        function func1() {
            var data = new Date();
           document.getElementById("pp1").value = data;
        }
        function func2() {
           document.getElementById("pp1").value = "";
        }
        function func3() {
            var data = new Date();
            var tn = document.getElementById("pp1").value;
            tn = parseInt(tn);
            data.setTime(data.getTime()+ tn*1000*60*60*24);
                        document.getElementById("pp1").value = data;

        }

        function func4() {
           document.getElementById("pp1").value = "ivan";
           document.getElementById("pp1").style.color = "red";
        }
    </script>
</head>
<body style="background-color: green">
    <p style="color:yellow"> Пример использования формы с кнопками</p>
    <form>
        <input id="pp1" type="text" size=80 value="">
        <br>
        <input type="button" value="Первая" onclick="func1()" style ="background-color: pink;">
        <input type="button" value="Вторая" onclick="func2()" style ="background-color: lightblue">
        <input type="button" value="Третья" onclick="func3()" style="background-color: lightgreen;">
        <input type="button" value="4" onclick="func4()" style="background-color: green;">
    </form>
    
</body>
</html>
