    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 36</title>
    <script>
        function func1() {
            var data = new Date();
            document.getElementById("tp1").value = data.setHours();
        };
        function func2() {
            var data = new Date();
            document.getElementById("tp1").value = data.getUTCHours();
        };
        function func3() {
            var data = new Date(2013,9,7,11,23,24);
            document.getElementById("tp1").value = data.setHours(23);
        };
    </script>

</head>

<body style="background-color: green;">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input id = "tp1"type="text" size=64 value="">
        <input style ="background-color: pink;" type="button" value="Первая" onclick="func1()">
        <input style ="background-color: lightblue"type="button" value="Вторая" onclick="func2()">
        <input style ="background-color: lightgreen;"type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
