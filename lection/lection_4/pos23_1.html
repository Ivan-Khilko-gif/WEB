<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 23_1</title>
    <script>
        function func1() {document.getElementById('rr1').src="../image/pic1.png"};
        var flag=true;
        function func2() {
            flag = !flag;
            if (flag) {
                document.getElementById('rr1').src="../image/pic2.png"
            } else {
                document.getElementById('rr1').src="../image/pic1.png"
            }
        };
    </script>
</head>

<body style="background-color: green;">
    <img id="rr1" src="../image/pic1.png" style="height: 150;" onclick="func2()">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
    </form>
</body>

</html>
