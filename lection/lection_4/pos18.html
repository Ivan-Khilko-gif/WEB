<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 18</title>
    <script>
        function func1() { document.body.style.backgroundColor = "red" };
        function func2() { document.body.style.backgroundColor = "white" };
        function func3() { document.body.style.backgroundColor = "green" };
    </script>

</head>

<body>
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
