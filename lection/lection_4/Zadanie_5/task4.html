<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 20</title>
    <script>
        function func1() {
            document.getElementById("tp1").style.backgroundColor = "pink";
            document.getElementById("tp1").value = "Вы нажали первую кнопку";

            document.getElementById("B1").value = "Нажата";
            document.getElementById("B2").value = "Вторая";
            document.getElementById("B3").value = "Третья";
        };
        function func2() {
            document.getElementById("tp1").style.backgroundColor = "lightblue";
            document.getElementById("tp1").value = "Вы нажали вторую кнопку";

            document.getElementById("B1").value = "Первая";
            document.getElementById("B2").value = "Нажата";
            document.getElementById("B3").value = "Третья";
        };
        function func3() {
            document.getElementById("tp1").style.backgroundColor = "lightgreen";
            document.getElementById("tp1").value = "Вы нажали третью кнопку";

            document.getElementById("B1").value = "Первая";
            document.getElementById("B2").value = "Вторая";
            document.getElementById("B3").value = "Нажата";
        };
    </script>

</head>

<body style="background-color: green;">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input id = "tp1" type="text" size=32 value="">
        <input id = "B1" style ="background-color: pink;" type="button" value="Первая" onclick="func1()">
        <input id = "B2" style ="background-color: lightblue"type="button" value="Вторая" onclick="func2()">
        <input id = "B3" style ="background-color: lightgreen;"type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
